<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisIQ Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <h1>AEGISIQ</h1>

        <p>AI Infrastructure Decision Intelligence Platform</p>

        <input
                type="text"
                id="username"
                placeholder="Username">

        <input
                type="password"
                id="password"
                placeholder="Password">

        <button onclick="login()">
            Login
        </button>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
